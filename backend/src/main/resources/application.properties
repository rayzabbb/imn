spring.application.name=intervialion
spring.h2.console.enabled=true
spring.jpa.show-sql=true

spring.datasource.username=sa
spring.datasource.password=
spring.datasource.url =jdbc:h2:./mydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=update

# Machine-specific settings and secrets live outside the repo: either environment
# variables or a git-ignored application-local.properties next to this module
# (see application-local.properties.example). Values there override this file.
spring.config.import=optional:file:./application-local.properties

# JWT signing secret (HS256, needs >= 256 bits) and access-token lifetime.
# Never committed: set JWT_SECRET, or app.jwt.secret in application-local.properties.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
